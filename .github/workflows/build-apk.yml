name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Preparar pruebas web sin red
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo mkdir -p /home/claude/v08 /home/claude/v091 /home/claude/apk
          sudo ln -sfn "$GITHUB_WORKSPACE/app/src/main/assets" /home/claude/v08/assets
          sudo ln -sfn "$GITHUB_WORKSPACE/app/src/main/assets" /home/claude/v091/assets
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/claude/apk/HistoriasVivas
      - name: Pruebas Playwright
        run: |
          set -euo pipefail
          for test in tests/*.js; do
            echo "Ejecutando $test"
            node "$test"
          done
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: historias-vivas-apk
          path: app/build/outputs/apk/debug/*.apk
