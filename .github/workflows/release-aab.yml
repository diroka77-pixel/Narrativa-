name: Compilar versión para Google Play (AAB firmado)
# Requiere cuatro "secrets" del repositorio: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (ver PLAY_STORE.md)
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Preparar la clave de firma
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Compilar AAB
        env:
          HV_KEYSTORE: ${{ runner.temp }}/release.jks
          HV_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: historias-vivas-aab
          path: app/build/outputs/bundle/release/*.aab
